name: E2E Tests

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium firefox

      - name: Build web
        run: npm run build
        working-directory: apps/web

      - name: Start services
        run: |
          docker compose up -d postgres
          sleep 10
          cd apps/api && npx prisma migrate deploy || true
          cd apps/api && npx prisma db seed || true
          cd apps/api && PORT=4001 node dist/src/main &
          cd apps/web && npx next start -p 3005 &
          sleep 15
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/basemap?schema=public

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test --project=chromium
        env:
          WEB_URL: http://localhost:3005
          API_URL: http://localhost:4001
          E2E_EMAIL: admin@basemap.com
          E2E_PASSWORD: admin123

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14
