# On-premise overrides. Enables MinIO, production-ish resource tuning,
# and exposes only necessary ports for a self-hosted deployment.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.onprem.yml --profile onprem up -d
version: '3.8'

services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'

  api:
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: basemap-assets
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:4000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    deploy:
      resources:
        limits: {memory: 2G}
        reservations: {memory: 1G}

  web:
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000

  elasticsearch:
    ports:
      - '127.0.0.1:9200:9200'

  neo4j:
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'