apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "basemap.fullname" . }}-config
  labels:
    {{- include "basemap.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.env.NODE_ENV | default "production" | quote }}
  POSTGRES_HOST: {{ .Values.env.POSTGRES_HOST | default "postgres" | quote }}
  POSTGRES_PORT: {{ .Values.env.POSTGRES_PORT | default "5432" | quote }}
  REDIS_HOST: {{ .Values.env.REDIS_HOST | default "redis" | quote }}
  ELASTICSEARCH_NODE: {{ .Values.web.env.ELASTICSEARCH_NODE | default "http://elasticsearch:9200" | quote }}
  NEO4J_URI: {{ .Values.env.NEO4J_URI | default "bolt://neo4j:7687" | quote }}
  STORAGE_PROVIDER: {{ .Values.api.env.STORAGE_PROVIDER | default "s3" | quote }}
  APP_URL: {{ .Values.api.env.APP_URL | default "" | quote }}