apiVersion: v1
kind: Service
metadata:
  name: {{ include "basemap.fullname" . }}-web
  labels:
    {{- include "basemap.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "basemap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web